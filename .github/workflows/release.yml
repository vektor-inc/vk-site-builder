name: Release
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
env:
  plugin_name: vk-site-builder
# GITHUB_TOKEN の権限は読み取りだけにし、書き込みが要るジョブで個別に足す.
permissions:
  contents: read
jobs:
  # 1. dist 作成 + スモークテスト
  smoke_test:
    name: Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          check-latest: true
          cache: npm
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2
      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT
      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-
      - name: Install NPM Scripts
        run: npm install
      - name: Install WP-CLI
        run: |
          curl -O https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          chmod +x wp-cli.phar
          sudo mv wp-cli.phar /usr/local/bin/wp
      - name: Create dist
        run: npm run dist
      # php_unit ジョブは vendor/ を開発用に置き換えて実行するため、配布する zip に更新チェッカーが入っているかはここで確かめる.
      - name: Check update checker in zip
        run: |
          listing=$(unzip -l dist/${{ env.plugin_name }}.zip)
          for f in \
            "${{ env.plugin_name }}/vendor/autoload.php" \
            "${{ env.plugin_name }}/vendor/yahnis-elsts/plugin-update-checker/plugin-update-checker.php"; do
            if ! grep -qF " $f" <<< "$listing"; then
              echo "::error::$f is missing in dist/${{ env.plugin_name }}.zip"
              exit 1
            fi
          done
          echo "update checker files OK"
      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Setup wp-env for dist
        run: |
          echo '{"plugins":["./dist/${{ env.plugin_name }}"]}' > .wp-env.json
      - name: Start wp-env
        run: |
          for n in 1 2 3; do npx wp-env start --update && break || [ "$n" -lt 3 ] || exit 1; done
      - name: Smoke test
        # vektor-inc/wp-actions main as of 2026-03-18
        uses: vektor-inc/wp-actions/smoke-test@90f5a231bc956543bf235f36be4928d57af2edab

  # 2. PHPUnit テスト（dist パッケージで実行）
  php_unit:
    name: PHP Unit Test
    runs-on: ubuntu-latest
    needs: [smoke_test]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          check-latest: true
          cache: npm
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2
      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT
      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-
      - name: Install NPM Scripts
        run: npm install
      - name: Install Composer Packages
        run: composer install
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Copy test dependencies into dist for phpunit
        run: |
          rm -rf dist/${{ env.plugin_name }}/vendor
          cp -rL vendor dist/${{ env.plugin_name }}/vendor
          found=0
          for f in .phpunit.xml phpunit.xml phpunit.xml.dist; do
            if [ -f "$f" ]; then
              cp "$f" "dist/${{ env.plugin_name }}/.phpunit.xml"
              found=1
              break
            fi
          done
          if [ "$found" -ne 1 ]; then
            echo "::error::phpunit config not found (.phpunit.xml / phpunit.xml / phpunit.xml.dist)"
            exit 1
          fi
          [ -d tests ] && cp -r tests "dist/${{ env.plugin_name }}/tests" || true
          ls dist/${{ env.plugin_name }}/vendor/bin/phpunit && echo "phpunit OK" || echo "phpunit NOT FOUND"
      - name: Setup wp-env for dist
        run: |
          echo '{"plugins":["./dist/${{ env.plugin_name }}"]}' > .wp-env.json
      - name: Start wp-env
        run: |
          for n in 1 2 3; do npx wp-env start --update && break || [ "$n" -lt 3 ] || exit 1; done
      - name: Run PHP Unit Test
        run: npm run phpunit

  # 3. GitHub Release（全テスト通過後）
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [smoke_test, php_unit]
    permissions:
      contents: write
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create Release
        # softprops/action-gh-release v2.6.1 / v2
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe
        with:
          generate_release_notes: true
          files: dist/${{ env.plugin_name }}.zip

  # 4. VWS デプロイ（GitHub Release 成功後）
  deploy_vws:
    name: Deploy to VWS
    runs-on: ubuntu-latest
    needs: [release]
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Deploy to VWS
        uses: burnett01/rsync-deployments@2651e3eecb4ea772cbe952695d04952e92027b4f # v5.2.1
        with:
          switches: -avzr
          path: dist/${{ env.plugin_name }}.zip
          remote_path: ${{ secrets.DEPLOY_PATH_VWS }}
          remote_host: ${{ secrets.DEPLOY_HOST_VWS }}
          remote_port: ${{ secrets.DEPLOY_PORT_VWS }}
          remote_user: ${{ secrets.DEPLOY_USER_VWS }}
          remote_key: ${{ secrets.DEPLOY_KEY_VWS }}
          remote_key_pass: ${{ secrets.DEPLOY_KEYPASS_VWS }}
